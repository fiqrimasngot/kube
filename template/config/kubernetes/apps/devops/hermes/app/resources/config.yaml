dashboard:
  public_url: https://hermes.${SECRET_DOMAIN}
  oauth:
    self_hosted:
      issuer: https://auth.${SECRET_DOMAIN}/application/o/hermes/
      client_id: O03jOEniqUJo7RXWc6HOGqcxyOp9NyJuFrdzKLd9
      scopes: openid profile email
model:
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  default: gpt-5.5
  api_mode: codex_responses
toolsets:
  - hermes-cli
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
  env_passthrough:
    - HASS_TOKEN
    - HASS_URL
memory:
  memory_enabled: true
  user_profile_enabled: true
  auto_migrate: true
  auto_summarize:
    threshold: 50
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
streaming:
  enabled: false
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true
platform_toolsets:
  cli:
    - hermes-cli
    - homeassistant
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
platforms:
  whatsapp:
    enabled: true
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  tool_use_enforcement: auto
group_sessions_per_user: true
