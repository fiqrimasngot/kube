---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app amdglobal
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      amdglobal:
        containers:
          web:
            image:
              repository: harbor.fiqriha.kim/amdglobal/amdglobal-web
              tag: build-77744c317e0bc74a1287b35b0e8c5065d43c0638@sha256:44cd912b8bb9f22f092ca5eb78b55148ba029bb87ff03470cefd1be036310423
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
    service:
      app:
        controller: amdglobal
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["amdglobal.fiqriha.kim"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
          - path: /var/run
          - path: /tmp
