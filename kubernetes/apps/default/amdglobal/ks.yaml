---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app amdglobal
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/default/amdglobal/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: default
  wait: true
  timeout: 5m
