---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crisp
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        pod:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
        containers:
          app:
            image:
              repository: ghcr.io/fiqrimasngot/crisp
              tag: 7cf8ea345b3ff7668bda8126a275ea90e55c8f04@sha256:9799de28f81be779c7248c096888b9baad7ea7fae97de9edad2d7777cb83bb41
            env:
              HOST: 0.0.0.0
              PORT: "5000"
              CRISP_MODEL_PATH: /app/project_model_best.keras
              CRISP_MAX_UPLOAD_BYTES: "10485760"
              TF_NUM_INTRAOP_THREADS: "2"
              TF_NUM_INTEROP_THREADS: "1"
              OMP_NUM_THREADS: "2"
            probes:
              # HTTP probes check the server; release acceptance also requires /predict.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 5000 }
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 5000 }
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /, port: 5000 }
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 100m, memory: 512Mi }
              limits: { cpu: "2", memory: 2Gi }
    service:
      main:
        controller: main
        type: ClusterIP
        ports:
          http:
            port: 5000
    route:
      main:
        hostnames: ["crisp.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: 5000
    persistence:
      tmp:
        type: emptyDir
        sizeLimit: 64Mi
        globalMounts:
          - path: /tmp
