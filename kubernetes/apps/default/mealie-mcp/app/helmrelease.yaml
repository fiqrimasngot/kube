---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie-mcp
spec:
  interval: 15m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mealie-mcp:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.12-bookworm-slim
            command: [uvx]
            args:
              - --from
              - git+https://github.com/rldiao/mealie-mcp-server
              - mealie-mcp-server
            env:
              MEALIE_BASE_URL: http://mealie.default.svc.cluster.local:9000
              MEALIE_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: MEALIE_API
              MCP_TRANSPORT: streamable-http
              MCP_HOST: 0.0.0.0
              MCP_PORT: "8765"
            ports:
              - containerPort: 8765
                name: http
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: mealie-mcp
        ports:
          http:
            port: 8765
