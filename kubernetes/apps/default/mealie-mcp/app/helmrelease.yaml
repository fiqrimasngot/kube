---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mealie-mcp
spec:
  interval: 15m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      mealie-mcp:
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/mdlopresti/mealie-mcp
              tag: 1.8.2
            env:
              MEALIE_URL: http://mealie.default.svc.cluster.local:9000
              MEALIE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: cluster-secrets
                    key: MEALIE_API
              MCP_TRANSPORT: http
              PORT: "3000"
              HOST: 0.0.0.0
              ALLOWED_HOSTS: mealie-mcp.default.svc.cluster.local
            ports:
              - containerPort: 3000
                name: http
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 20
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: http
                  initialDelaySeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: mealie-mcp
        ports:
          http:
            port: 3000
