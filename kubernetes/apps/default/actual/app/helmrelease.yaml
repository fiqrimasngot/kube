---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app actual
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template

  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          enableServiceLinks: false
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            fsGroupChangePolicy: "OnRootMismatch"

        containers:
          main:
            image:
              repository: ghcr.io/actualbudget/actual-server
              tag: 25.12.0
            # resources:
            #   requests:
            #     cpu: 12m
            #     memory: 80M
            #   limits:
            #     memory: 128M
            #
    service:
      main:
        controller: main
        ports:
          http:
            port: &port 5006

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Actual Finance
          # gethomepage.dev/group: "{{ title .Release.Namespace }}"
          gethomepage.dev/group: "Home"
          gethomepage.dev/name: "{{ title .Release.Name }}"
          gethomepage.dev/icon: sh-actual-budget
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values \"service\" \"main\" \"ports\" \"http\" \"port\" }}"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: main
                port: *port
    persistence:
      data:
        enabled: true
        existingClaim: actual-config
        advancedMounts:
          main:
            main:
              - path: /data
