---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opengym
spec:
  interval: 15m
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  driftDetection:
    mode: enabled
  maxHistory: 3
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      opengym:
        replicas: 1
        strategy: Recreate
        containers:
          api:
            image:
              repository: ghcr.io/duartesantos8/opengym-api
              tag: 1.4.1
            env:
              PORT: "3000"
              DATA_DIR: /data
              RP_ID: opengym.fiqriha.kim
              ORIGIN: https://opengym.fiqriha.kim
              RP_NAME: openGym
              FIRST_USER_ADMIN: "1"
              INVITE_ONLY: "0"
              ALLOW_GUEST: "0"
              SESSION_DAYS: "90"
            ports:
              - containerPort: 3000
                name: api
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: api
                  initialDelaySeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: api
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 512Mi
          web:
            image:
              repository: ghcr.io/duartesantos8/opengym-web
              tag: 1.4.3
            env:
              NGINX_PORT: "8080"
              BACKEND: 127.0.0.1
              PORT: "3000"
            ports:
              - containerPort: 8080
                name: web
            resources:
              requests:
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: opengym
        ports:
          http:
            port: &port 8080
            targetPort: web
    route:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Workout tracker
          gethomepage.dev/group: "{{ title .Release.Namespace }}"
          gethomepage.dev/name: "{{ title .Release.Name }}"
          gethomepage.dev/icon: "{{ .Release.Name }}"
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values \"service\" \"app\" \"ports\" \"http\" \"port\" }}"
        hostnames: [opengym.fiqriha.kim]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        existingClaim: opengym-data
        globalMounts:
          - path: /data
