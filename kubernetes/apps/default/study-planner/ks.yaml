---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app study-planner
  namespace: flux-system
spec:
  interval: 30m
  path: ./kubernetes/apps/default/study-planner/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: default
  wait: true
  timeout: 5m
