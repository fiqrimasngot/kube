---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app study-planner
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      study-planner:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:87627baaddb0cabed4ebe033e75038e5c7b6b081c18e86514c99067179a90719
            envFrom:
              - secretRef:
                  name: *app
        containers:
          api:
            image:
              repository: harbor.fiqriha.kim/library/study-planner-api
              tag: build-79ed60249cabb7d5e93eec93e30571d38c586301@sha256:81223a269bde6f8d5bdb967130ca4e352a6ff3ca8f68058eeb78439aed79a341
            env:
              BIND_HOST: 0.0.0.0
              DB_HOST:
                valueFrom: { secretKeyRef: { name: *app, key: DB_HOST } }
              DB_PORT:
                valueFrom: { secretKeyRef: { name: *app, key: DB_PORT } }
              DB_NAME:
                valueFrom: { secretKeyRef: { name: *app, key: DB_NAME } }
              DB_USER:
                valueFrom: { secretKeyRef: { name: *app, key: DB_USER } }
              DB_PASSWORD:
                valueFrom: { secretKeyRef: { name: *app, key: DB_PASSWORD } }
            ports:
              - name: api
                containerPort: 8081
                protocol: TCP
            probes:
              liveness: &apiProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz
                    port: api
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *apiProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests: { cpu: 10m, memory: 32Mi }
              limits: { memory: 128Mi }
          web:
            image:
              repository: harbor.fiqriha.kim/library/study-planner-web
              tag: build-79ed60249cabb7d5e93eec93e30571d38c586301@sha256:1dd7e33509ef3b6f3b014773deff70308b99d82ec2de32f12aa7c9c14bf120a0
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
            probes:
              liveness: { enabled: true }
              readiness: { enabled: true }
    service:
      app:
        controller: study-planner
        ports:
          http:
            port: 8080
    route:
      app:
        hostnames: ["study.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
          - name: envoy-external
            namespace: network
            sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: Study Planner
          gethomepage.dev/icon: mdi-calendar-check
          gethomepage.dev/description: Plan and track study sessions
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:8080"
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
          - path: /var/run
          - path: /tmp
