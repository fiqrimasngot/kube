---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mealie
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  targetNamespace: default
  path: ./kubernetes/apps/default/mealie/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  components:
    - ../../../../components/volsync
  postBuild:
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 500Mi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  interval: 30m
  retryInterval: 1m
  timeout: 5m
