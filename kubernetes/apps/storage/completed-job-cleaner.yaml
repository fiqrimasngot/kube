---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: completed-job-cleaner
  namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: completed-job-cleaner
  namespace: storage
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: completed-job-cleaner
  namespace: storage
subjects:
  - kind: ServiceAccount
    name: completed-job-cleaner
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: completed-job-cleaner
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: completed-job-cleaner
  namespace: storage
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: completed-job-cleaner
          restartPolicy: Never
          containers:
            - name: kubectl
              image: alpine/k8s:1.37.1
              command:
                - /bin/sh
                - -ec
                - |
                  names=$(kubectl get jobs -n storage --field-selector=status.successful=1 -o jsonpath='{range .items[?(@.status.completionTime)]}{.metadata.name}{"\n"}{end}')
                  for name in $names; do
                    kubectl delete job "$name" -n storage --ignore-not-found
                  done
