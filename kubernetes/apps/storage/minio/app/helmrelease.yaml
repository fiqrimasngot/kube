---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app minio
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      minio:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: quay.io/minio/minio
              tag: RELEASE.2024-06-29T01-20-47Z@sha256:fce0a90a37bb2887c850b68b61a0ac8ac02ea218b58eaea96bb7ca69eb503e20
            env:
              MINIO_API_CORS_ALLOW_ORIGIN: https://minio.${SECRET_DOMAIN},https://s3.${SECRET_DOMAIN}
              MINIO_BROWSER_REDIRECT_URL: https://minio.${SECRET_DOMAIN}
              MINIO_IDENTITY_OPENID_CLAIM_NAME: "groups"
              #MINIO_PROMETHEUS_JOB_ID: minio
              #MINIO_PROMETHEUS_URL: https://prometheus.${SECRET_DOMAIN}
              #MINIO_PROMETHEUS_AUTH_TYPE: public
              # MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Login with Authentik"
              # MINIO_IDENTITY_OPENID_CONFIG_URL:
              #   valueFrom:
              #     secretKeyRef:
              #       name: minio-secret
              #       key: openid-config-url
              # MINIO_IDENTITY_OPENID_CLIENT_ID:
              #   valueFrom:
              #     secretKeyRef:
              #       name: minio-secret
              #       key: openid-config-client-id
              # MINIO_IDENTITY_OPENID_CLIENT_SECRET:
              #   valueFrom:
              #     secretKeyRef:
              #       name: minio-secret
              #       key: openid-config-client-secret
              # MINIO_IDENTITY_OPENID_SCOPES:
              #   valueFrom:
              #     secretKeyRef:
              #       name: minio-secret
              #       key: openid-config-scopes
              # MINIO_IDENTITY_OPENID_REDIRECT_URI:
              #   valueFrom:
              #     secretKeyRef:
              #       name: minio-secret
              #       key: openid-config-callback-uri
              # MINIO_SERVER_URL: https://s3.${SECRET_DOMAIN}
              MINIO_UPDATE: "off"
            envFrom:
              - secretRef:
                  name: minio-secret
            args: ["server", "/data", "--console-address", ":9001"]
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /minio/health/live
                    port: 9000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: minio
        ports:
          http:
            port: 9001
          s3:
            port: 9000
    serviceMonitor:
      app:
        serviceName: minio
        endpoints:
          - port: s3
            scheme: http
            path: /minio/v2/metrics/cluster
            interval: 1m
            scrapeTimeout: 10s
    ingress:
      app:
        className: external
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: "{{ title .Release.Name }}"
          gethomepage.dev/icon: "{{ .Release.Name }}"
          gethomepage.dev/description: "S3 storage"
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values \"service\" \"app\" \"ports\" \"http\" \"port\" }}"
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hosts:
          - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
          - host: s3.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: s3
    persistence:
      config:
        enabled: true
        existingClaim: backups
        # type: nfs
        # server: ${SECRET_NFS_SVC}
        # path: ${SECRET_NFS_MNT}/minio
        globalMounts:
          - path: /data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
spec:
  storageClassName: zfs-k8s-0-library
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "2199023255552"

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: backups-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: "2199023255552"
  claimRef:
    apiVersion: v1
    kind: PersistentVolumeClaim
    name: backups
    namespace: storage
  csi:
    driver: zfs.csi.openebs.io
    fsType: zfs
    volumeAttributes:
      openebs.io/poolname: k8s-0-library
    volumeHandle: backups
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-0
  persistentVolumeReclaimPolicy: Retain
  storageClassName: zfs-k8s-0-library
  volumeMode: Filesystem
