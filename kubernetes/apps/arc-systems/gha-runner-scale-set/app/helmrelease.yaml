---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-runners
spec:
  chartRef:
    kind: OCIRepository
    name: gha-runner-scale-set
  interval: 1h
  values:
    githubConfigUrl: https://github.com/fiqrimasngot/kube
    runnerScaleSetName: gha-kube
    githubConfigSecret: github-app-secret
    controllerServiceAccount:
      name: arc
      namespace: arc-systems
    runnerGroup: Default
    minRunners: 1
    maxRunners: 4
    listenerConfig: null
    containerMode:
      type: dind
    template:
      spec:
        volumes:
          - name: kvm
            hostPath:
              path: /dev/kvm
              type: CharDevice
          - name: tun
            hostPath:
              path: /dev/net/tun
              type: CharDevice
        containers:
          - name: runner
            image: ghcr.io/actions/actions-runner:latest
            command:
              - /home/runner/run.sh
            # Talos QEMU needs KVM device access and network namespace mounts.
            # This grants jobs host-level access; only use this scale set for trusted code.
            securityContext:
              privileged: true
            volumeMounts:
              - name: kvm
                mountPath: /dev/kvm
              - name: tun
                mountPath: /dev/net/tun
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                cpu: 2
                memory: 4Gi
