apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crisp-training-broker-apiserver
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crisp-training-broker
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
