# Source is packaged into a hashed ConfigMap by app/kustomization.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crisp-training-broker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: crisp-training-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crisp-training-broker
    spec:
      serviceAccountName: crisp-training-broker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: python:3.13.11-slim@sha256:2b9c9803c6a287cafa0a8c917211dddd23dcd2016f049690ee5219f5d3f1636e
          command: [/bin/sh, -ec]
          args:
            - >-
              export TMPDIR=/deps HOME=/deps;
              pip install --no-cache-dir --target /deps PyJWT==2.15.0 cryptography==46.0.3 &&
              exec python /broker/training_broker.py
          env:
            - name: PYTHONPATH
              value: /deps
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: source, mountPath: /broker, readOnly: true }
            - { name: deps, mountPath: /deps }
      volumes:
        - name: source
          configMap:
            name: crisp-training-broker-source
            defaultMode: 0444
        - name: deps
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: crisp-training-broker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crisp-training-broker
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
