apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crisp-public-dataset
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 40Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crisp-model-output
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 64Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: crisp-training-gpu
spec:
  hard:
    requests.nvidia.com/gpu: "1"
    limits.nvidia.com/gpu: "1"
    count/jobs.batch: "5"
