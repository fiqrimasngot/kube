---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  values:
    controllers:
      open-webui:
        containers:
          app:
            env:
              DATABASE_TYPE: postgresql
              DEFAULT_LOCALE: ${TIMEZONE}
              DEFAULT_USER_ROLE: user
              ENABLE_LOGIN_FORM: false
              ENABLE_OAUTH_GROUP_CREATION: true
              ENABLE_OAUTH_GROUP_MANAGEMENT: true
              ENABLE_OAUTH_ROLE_MANAGEMENT: true
              ENABLE_OAUTH_SIGNUP: true
              # ENABLE_OLLAMA_API: false
              # ENABLE_OPENAI_API: true
              ENABLE_RAG_WEB_SEARCH: true
              ENABLE_SEARCH_QUERY: true
              ENABLE_VERSION_UPDATE_CHECK: false
              ENABLE_WEBSOCKET_SUPPORT: true
              IMAGE_GENERATION_ENGINE: automatic1111
              IMAGE_GENERATION_MODEL: dreamshaper_8
              IMAGE_SIZE: 400x400
              IMAGE_STEPS: 8
              OLLAMA_BASE_URL: http://ollama.devops.svc.cluster.local:11434
              # OAUTH_ADMIN_ROLES: admin
              # OAUTH_ALLOWED_ROLES: users, admin
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: true
              # OAUTH_PICTURE_CLAIM: avatar
              # OAUTH_PROVIDER_NAME: t-node
              # OAUTH_ROLES_CLAIM: groups
              # OAUTH_SCOPES: openid email profile avatar
              OAUTH_UPDATE_PICTURE_ON_LOGIN: true
              RAG_WEB_SEARCH_ENGINE: tavily
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/6
              WEBUI_URL: https://chad.${SECRET_DOMAIN}
            envFrom: &envFrom
              - secretRef:
                  name: open-webui
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
            resources:
              limits:
                memory: 2Gi
              requests:
                cpu: 250m
                memory: 1Gi
        initContainers:
          init-db:
            envFrom: *envFrom
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6.0@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
        pod:
          annotations:
            reloader.stakater.com/auto: "true"
        strategy: RollingUpdate
    persistence:
      data:
        existingClaim: ollama
        globalMounts:
          - path: /app/backend/data
      tmpfs:
        advancedMounts:
          open-webui:
            app:
              - path: /tmp
                subPath: tmp
        type: emptyDir
    route:
      app:
        annotations:
          gethomepage.dev/app: open-webui
          gethomepage.dev/description: Interact with your AI models
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: AI
          gethomepage.dev/icon: sh-open-webui.svg
          gethomepage.dev/name: Open WebUI
        hostnames: ["chad.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    service:
      app:
        controller: open-webui
        ports:
          http:
            port: 80
            targetPort: 8080
