# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/app-template-4.6.2/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      open-webui:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18
            envFrom: &envFrom
              - secretRef:
                  name: *app
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: 0.7.2@sha256:16d9a3615b45f14a0c89f7ad7a3bf151f923ed32c2e68f9204eb17d1ce40774b
              pullPolicy: IfNotPresent
            envFrom: *envFrom
            env:
              TZ: ${TIMEZONE}
              GLOBAL_LOG_LEVEL: WARNING
              CORS_ALLOW_ORIGIN: https://chad.${SECRET_DOMAIN}
              # OPENAI_API_KEY: ${openai_api_key}
              ENABLE_LITELLM: "false"
              ENABLE_LOGIN_FORM: "false"
              ENABLE_PASSWORD_AUTH: "false"
              OAUTH_PROVIDER_NAME: Authentik
              ENABLE_OAUTH_SIGNUP: "true"
              OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
            probes:
              liveness: &probe
                enabled: true
                type: HTTP
                path: /health
              readiness: *probe
              startup:
                <<: *probe
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
        pod:
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          # labels:
          #   policy.gabe565.com/egress-authentik: "true"
          #   policy.gabe565.com/egress-namespace: "true"
          #   policy.gabe565.com/egress-world: "true"
          #   policy.gabe565.com/ingress-envoy-public: "true"
          # hostAliases:
          #   - ip: 10.43.0.20
          #     hostnames:
          #       - ${oauth_host}

    service:
      open-webui:
        controller: open-webui
        ports:
          http:
            port: 8080

    persistence:
      data:
        existingClaim: "ollama"
      tmp:
        type: emptyDir
        medium: Memory
        sizeLimit: 128Mi

    route:
      open-webui:
        parentRefs:
        - name: envoy-external
          namespace: network
        hostnames:
          - chad.${SECRET_DOMAIN}
