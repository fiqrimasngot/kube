---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: harbor
spec:
  interval: 12h
  url: https://helm.goharbor.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: harbor
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: harbor
      version: 1.19.4
      sourceRef:
        kind: HelmRepository
        name: harbor
      interval: 12h
  values:
    expose:
      type: clusterIP
      tls:
        enabled: false
      clusterIP:
        name: harbor
        ports:
          httpPort: 80
          httpsPort: 443
    externalURL: https://harbor.${SECRET_DOMAIN}
    existingSecretAdminPassword: harbor-admin
    existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
    harborAdminPassword: ""
    persistence:
      enabled: true
      resourcePolicy: keep
      persistentVolumeClaim:
        registry:
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 200Gi
        jobservice:
          jobLog:
            storageClass: ceph-block
            accessMode: ReadWriteOnce
            size: 5Gi
        database:
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 20Gi
        redis:
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 5Gi
        trivy:
          storageClass: ceph-block
          accessMode: ReadWriteOnce
          size: 10Gi
    trivy:
      enabled: true
    notary:
      enabled: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
