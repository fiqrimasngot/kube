---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        # Populate the persistent /opt/data/.local tree with extra CLI tooling
        # (gh, Go, Homebrew) the agent and the code-server terminal can use. The
        # file-existence guards mean the downloads only run on first start, since
        # /opt/data is the data PVC and survives restarts.
        initContainers:
          copy-config:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                cp /run/config/honcho.json /opt/data/honcho.json
                mkdir -p /opt/data/scripts
                cp /run/config/kanban-status-whatsapp.py /opt/data/scripts/kanban-status-whatsapp.py
                chmod 0755 /opt/data/scripts/kanban-status-whatsapp.py
                chown 10000:10000 /opt/data/scripts/kanban-status-whatsapp.py
                mkdir -p /opt/data/profiles/automationops
                cp /run/config/profile-automationops.yaml /opt/data/profiles/automationops/config.yaml
                chown 10000:10000 /opt/data/profiles/automationops/config.yaml
                mkdir -p /opt/data/profiles/kubeimplementer
                cp /run/config/profile-kubeimplementer.yaml /opt/data/profiles/kubeimplementer/config.yaml
                chown 10000:10000 /opt/data/profiles/kubeimplementer/config.yaml
                mkdir -p /opt/data/profiles/researcher
                cp /run/config/profile-researcher.yaml /opt/data/profiles/researcher/config.yaml
                chown 10000:10000 /opt/data/profiles/researcher/config.yaml
                mkdir -p /opt/data/profiles/reviewer
                cp /run/config/profile-reviewer.yaml /opt/data/profiles/reviewer/config.yaml
                chown 10000:10000 /opt/data/profiles/reviewer/config.yaml
                for profile in automationops kubeimplementer researcher reviewer; do
                  profile_dir="/opt/data/profiles/$profile"
                  mkdir -p "$profile_dir/skills"
                  touch "$profile_dir/.no-bundled-skills"
                  if [ -d /opt/data/skills ]; then
                    for category in /opt/data/skills/*; do
                      [ -d "$category" ] || continue
                      for shared_skill in "$category"/*; do
                        [ -f "$shared_skill/SKILL.md" ] || continue
                        rm -rf "$profile_dir/skills/${category##*/}/${shared_skill##*/}"
                      done
                    done
                  fi
                  chown -R 10000:10000 "$profile_dir/skills" "$profile_dir/.no-bundled-skills"
                done
                chown 10000:10000 /opt/data/config.yaml
                chown 10000:10000 /opt/data/honcho.json
          patch-kanban-skill-check:
            image:
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                python3 - <<'PY'
                from pathlib import Path
                import shutil

                source = Path("/opt/hermes/hermes_cli")
                target = Path("/patched-hermes-cli")
                shutil.copytree(source, target, dirs_exist_ok=True)

                path = target / "kanban_db.py"
                text = path.read_text(encoding="utf-8")
                helper = '''def _validate_task_skills_for_assignee(assignee: Optional[str], skills: Optional[list[str]]) -> None:
                    """Reject a task before it is stored when its assignee cannot load a requested skill."""
                    if not assignee or not skills:
                        return
                    from hermes_cli.profiles import get_profile_dir
                    from hermes_constants import get_default_hermes_root
                    from tools.skill_usage import _read_skill_name

                    profile_dir = get_profile_dir(assignee)
                    if not profile_dir.is_dir():
                        raise ValueError(f"assignee profile does not exist: {assignee!r}")
                    roots = [profile_dir / "skills", get_default_hermes_root() / "skills"]
                    available = set()
                    for root in roots:
                        if not root.is_dir():
                            continue
                        for skill_md in root.rglob("SKILL.md"):
                            available.add(skill_md.parent.name)
                            with contextlib.suppress(OSError):
                                available.add(_read_skill_name(skill_md, skill_md.parent.name))
                    missing = [name for name in skills if name not in available]
                    if missing:
                        raise ValueError(
                            f"assignee {assignee!r} cannot load required skill(s): {', '.join(missing)}. "
                            "Add the skill to the shared skill set or to the assignee profile first."
                        )


                '''
                function_marker = "def create_task(\n"
                call_marker = "    skills_list = _normalize_task_skills(skills)\n"
                if function_marker not in text or call_marker not in text:
                    raise SystemExit("Hermes kanban source changed, refusing to apply the skill validation patch")
                text = text.replace(function_marker, helper + function_marker, 1)
                text = text.replace(
                    call_marker,
                    call_marker + "    _validate_task_skills_for_assignee(assignee, skills_list)\n",
                    1,
                )
                path.write_text(text, encoding="utf-8")
                PY
          install-tools:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command:
              - /bin/sh
              - -c
              - |
                set -e
                mkdir -p /opt/data/.local/bin /opt/data/.local/go

                rm -f /opt/data/.local/bin/hermes /opt/data/.local/bin/docker

                case "$(uname -m)" in
                  x86_64) tool_arch=amd64 ;;
                  aarch64) tool_arch=arm64 ;;
                  *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
                esac

                if [ ! -x /opt/data/.local/bin/kubectl.real ]; then
                  curl -fsSL "https://dl.k8s.io/release/v1.37.1/bin/linux/$${tool_arch}/kubectl" \
                    -o /opt/data/.local/bin/kubectl.real
                fi

                if [ ! -x /opt/data/.local/bin/talosctl.real ]; then
                  curl -fsSL "https://github.com/siderolabs/talos/releases/download/v1.14.4/talosctl-linux-$${tool_arch}" \
                    -o /opt/data/.local/bin/talosctl.real
                fi

                cat > /opt/data/.local/bin/kubectl <<'EOF'
                #!/bin/sh
                set -eu
                if [ -z "${KUBECONFIG:-}" ]; then
                  case "$PWD" in
                    /opt/data/workspace/kube-kl/k8s|/opt/data/workspace/kube-kl/k8s/*)
                      export KUBECONFIG=/opt/data/workspace/kube-kl/k8s/kubeconfig
                      ;;
                    /opt/data/workspace/kube|/opt/data/workspace/kube/*)
                      export KUBECONFIG=/opt/data/workspace/kube/kubeconfig
                      ;;
                  esac
                fi
                exec /opt/data/.local/bin/kubectl.real "$@"
                EOF

                cat > /opt/data/.local/bin/talosctl <<'EOF'
                #!/bin/sh
                set -eu
                if [ -z "${TALOSCONFIG:-}" ]; then
                  case "$PWD" in
                    /opt/data/workspace/kube-kl/k8s|/opt/data/workspace/kube-kl/k8s/*)
                      export TALOSCONFIG=/opt/data/workspace/kube-kl/k8s/talos/talosconfig
                      ;;
                    /opt/data/workspace/kube|/opt/data/workspace/kube/*)
                      export TALOSCONFIG=/opt/data/workspace/kube/talos/talosconfig
                      ;;
                  esac
                fi
                exec /opt/data/.local/bin/talosctl.real "$@"
                EOF

                chmod 0755 \
                  /opt/data/.local/bin/kubectl \
                  /opt/data/.local/bin/kubectl.real \
                  /opt/data/.local/bin/talosctl \
                  /opt/data/.local/bin/talosctl.real

                if [ ! -f /opt/data/.local/bin/gh ]; then
                  cd /tmp
                  curl -fsSL https://github.com/cli/cli/releases/download/v2.61.0/gh_2.61.0_linux_amd64.tar.gz -o gh.tar.gz
                  tar xzf gh.tar.gz
                  cp gh_2.61.0_linux_amd64/bin/gh /opt/data/.local/bin/
                  rm -rf gh.tar.gz gh_2.61.0_linux_amd64
                fi

                if [ ! -f /opt/data/.local/go/bin/go ]; then
                  cd /tmp
                  curl -fsSL https://go.dev/dl/go1.23.5.linux-amd64.tar.gz -o go.tar.gz
                  tar xzf go.tar.gz
                  mv go /opt/data/.local/
                  rm -rf go.tar.gz
                fi

                if [ ! -f /opt/data/.local/homebrew/bin/brew ]; then
                  export HOMEBREW_PREFIX=/opt/data/.local/homebrew
                  mkdir -p $HOMEBREW_PREFIX
                  git clone --depth 1 https://github.com/Homebrew/brew $HOMEBREW_PREFIX
                fi

                # Ensure brew's lock dir exists — brew creates it on first run but
                # only if the parent tree is writable. Without this, brew fails on
                # a fresh PVC before the first `brew install`.
                mkdir -p /opt/data/.local/homebrew/var/homebrew/locks
        containers:
          app:
            image: *image
            args:
              - gateway
              - run
            env:
              TZ: &tz ${TIMEZONE}
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &port 8642
              HOME: /opt/data
              HERMES_HOME: /opt/data
              # Run the dashboard under s6 in THIS container (not a sidecar): the
              # dashboard manages the gateway via s6-svc on the local /run/service
              # tree, so it must share the gateway's container to see/restart it.
              # HOST/PORT default to 0.0.0.0:9119. Dashboard auth is handled by
              # Authentik through Hermes' self-hosted OIDC provider. Explicitly
              # blank the old basic-auth env keys from hermes-secret so OAuth is
              # the only interactive login option.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_TUI: "1"
              HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ""
              HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
              HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ""
              HERMES_DASHBOARD_BASIC_AUTH_SECRET: ""
              SEARXNG_URL: http://searxng.default.svc.cluster.local:8080
              # Make the tools staged by the install-tools initContainer usable by
              # the agent's shell-outs. This is the image's own default PATH (which
              # already carries /opt/hermes/bin, the venv, and /opt/data/.local/bin)
              # with the Go and Homebrew bin dirs spliced in — keeping the default
              # intact so the dashboard's s6-svc gateway control is unaffected.
              GOPATH: /opt/data/go
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              PATH: /opt/hermes/bin:/opt/hermes/.venv/bin:/opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              PIP_BREAK_SYSTEM_PACKAGES: "1"
              # Talos Linux disables unprivileged user namespaces at the kernel
              # level (no AppArmor userns file, just a kernel-level restriction).
              # Hermes auto-detects the Ubuntu/AppArmor variant via
              # /proc/sys/kernel/apparmor_restrict_unprivileged_userns, but that
              # file doesn't exist on Talos — so auto-detection falls through and
              # Chrome exits with "No usable sandbox!". Setting AGENT_BROWSER_ARGS
              # directly bypasses auto-detection and forces --no-sandbox for every
              # browser launch.
              AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage"
            envFrom:
              - secretRef:
                  name: hermes-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              # Don't drop capabilities: s6-overlay init runs as root and needs
              # CAP_CHOWN (fix /opt/data ownership) plus CAP_SETUID/CAP_SETGID to
              # drop privileges to the image's hermes user (10000). Dropping ALL
              # breaks both ("chown failed", "unable to set supplementary group list").
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 3Gi
      codeserver:
        strategy: Recreate
        # hermes owns its home (/opt/data) as uid 10000, mode 0700, and resets it on
        # start, so the default coder user (1000) can't enter even via the fsGroup.
        # Run code-server as the hermes user so it owns the workspace it edits.
        # (coder image isn't s6-based, so forcing the uid is safe.)
        pod:
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
          # codeserver shares hermes's RWO "hermes" PVC (/opt/data), so it must run
          # on the same node as the hermes controller — otherwise the volume can't
          # multi-attach and codeserver is stuck Pending.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: hermes
                      app.kubernetes.io/controller: hermes
                  topologyKey: kubernetes.io/hostname
        containers:
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.143.1@sha256:377b66bec5645510ed52549bb00e648c273edc604d230a3f90fd2b2433afcb97
            env:
              TZ: *tz
              HOME: /opt/data
              # Expose the install-tools binaries (gh, go, brew) in the code-server
              # terminal. This is the coder image's standard PATH with the persisted
              # /opt/data/.local bins prepended (no /opt/hermes here — different image).
              GOPATH: /opt/data/go
              HOMEBREW_PREFIX: /opt/data/.local/homebrew
              HOMEBREW_CELLAR: /opt/data/.local/homebrew/Cellar
              HOMEBREW_REPOSITORY: /opt/data/.local/homebrew
              PATH: /opt/data/.local/bin:/opt/data/.local/go/bin:/opt/data/.local/homebrew/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/opt/data/.vscode",
                "--extensions-dir",
                "/opt/data/.vscode",
                "--port",
                "12321",
                "/opt/data",
              ]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi

    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        # hermes-agent uses s6-overlay: its entrypoint must start as root to fix
        # /run permissions, then drops to the image's internal hermes user (uid 10000).
        # Forcing runAsUser breaks s6 preinit ("/run belongs to uid 0 ... lacking
        # privileges to fix it"), so only set fsGroup to match the image user.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      hermes:
        controller: hermes
        ports:
          dashboard:
            port: 9119
          agent:
            port: *port
      codeserver:
        controller: codeserver
        ports:
          http:
            port: 12321

    route:
      hermes:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: Hermes
          gethomepage.dev/icon: sh-hermes
          gethomepage.dev/description: Hermes Agent
          gethomepage.dev/siteMonitor: http://hermes.devops.svc.cluster.local:9119
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - hermes.${SECRET_DOMAIN}
        rules:
          # The dashboard hardcodes its CORS/origin allow-list to localhost only, so
          # the WebSocket handshake (Origin: https://hermes.mcgrath.nz) is rejected
          # with 403. Rewrite Origin to an allowed value; the browser doesn't enforce
          # CORS on the WS upgrade, so this only satisfies the server-side check.
          - filters:
              - type: RequestHeaderModifier
                requestHeaderModifier:
                  set:
                    - name: Origin
                      value: http://localhost:9119
            backendRefs:
              - identifier: hermes
                port: dashboard
      codeserver:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Services
          gethomepage.dev/name: Hermes Code Server
          gethomepage.dev/icon: mdi-code-braces
          gethomepage.dev/description: Hermes configuration editor
          gethomepage.dev/pod-selector: app.kubernetes.io/controller=codeserver
          gethomepage.dev/siteMonitor: http://hermes-codeserver.devops.svc.cluster.local:12321
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - hermesconf.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - identifier: codeserver
                port: http

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      tmp:
        type: emptyDir
      hermes-cli-patch:
        type: emptyDir
        advancedMounts:
          hermes:
            patch-kanban-skill-check:
              - path: /patched-hermes-cli
            app:
              - path: /opt/hermes/hermes_cli

      config:
        type: configMap
        name: hermes-configmap
        defaultMode: 0o755
        advancedMounts:
          hermes:
            copy-config:
              - path: /run/config/config.yaml
                subPath: config.yaml
              - path: /run/config/honcho.json
                subPath: honcho.json
              - path: /run/config/kanban-status-whatsapp.py
                subPath: kanban-status-whatsapp.py
              - path: /run/config/profile-automationops.yaml
                subPath: profile-automationops.yaml
              - path: /run/config/profile-kubeimplementer.yaml
                subPath: profile-kubeimplementer.yaml
              - path: /run/config/profile-researcher.yaml
                subPath: profile-researcher.yaml
              - path: /run/config/profile-reviewer.yaml
                subPath: profile-reviewer.yaml

    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources:
                [
                  "pods",
                  "nodes",
                  "services",
                  "namespaces",
                  "configmaps",
                  "persistentvolumes",
                  "persistentvolumeclaims",
                  "endpoints",
                  "resourcequotas",
                  "limitranges",
                  "serviceaccounts",
                  "events",
                ] # Added events
              verbs: ["get", "list", "watch"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list"]
            - apiGroups: ["apps"]
              resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources: ["jobs", "cronjobs"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources: ["ingresses", "networkpolicies"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["storage.k8s.io"]
              resources: ["storageclasses"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["rbac.authorization.k8s.io"]
              resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["metrics.k8s.io"]
              resources: ["nodes", "pods"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["kustomize.toolkit.fluxcd.io"]
              resources: ["kustomizations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["external-secrets.io"]
              resources: ["externalsecrets"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["volsync.backube"]
              resources: ["replicationsources", "replicationdestinations"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["postgresql.cnpg.io"]
              resources: ["clusters", "backups", "scheduledbackups"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["autoscaling.k8s.io"]
              resources: ["verticalpodautoscalers"]
              verbs: ["get", "list", "watch"]
        hermes-cluster-ops:
          type: ClusterRole
          rules:
            - apiGroups: ["helm.toolkit.fluxcd.io"]
              resources: ["helmreleases"]
              verbs: ["patch", "update"]
            - apiGroups: [""]
              resources: ["persistentvolumes"]
              verbs: ["delete", "patch"]
        hermes-write-restricted:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["delete"]
            - apiGroups: ["batch"]
              resources: ["jobs"]
              verbs: ["delete"]
            - apiGroups: [""]
              resources: ["pods/exec"]
              verbs: ["create"]
            - apiGroups: ["apps"]
              resources: ["deployments"]
              verbs: ["patch", "update"]
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-cluster-ops:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-cluster-ops
          subjects:
            - identifier: hermes
              serviceAccount: hermes
        hermes-write-restricted:
          type: RoleBinding
          roleRef:
            identifier: hermes-write-restricted
          subjects:
            - identifier: hermes
              serviceAccount: hermes
    serviceAccount:
      hermes: {}
