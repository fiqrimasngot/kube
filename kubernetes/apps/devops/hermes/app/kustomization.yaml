---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./k8s-controlplane-service.yaml
  - ./k8s-worker-0-service.yaml
  - ./k8s-worker-1-service.yaml
configMapGenerator:
  - name: hermes-configmap
    files:
      - config.yaml=./resources/config.yaml
      - honcho.json=./resources/honcho.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
