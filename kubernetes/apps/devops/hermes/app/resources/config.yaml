dashboard:
  public_url: https://hermes.fiqriha.kim
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://auth.fiqriha.kim/application/o/hermes/
      client_id: O03jOEniqUJo7RXWc6HOGqcxyOp9NyJuFrdzKLd9
      scopes: openid profile email offline_access
  trusted_proxies:
    - 10.42.0.0/16
model:
  provider: openai-codex
  base_url: https://chatgpt.com/backend-api/codex
  default: gpt-5.6-luna
  api_mode: codex_responses
toolsets:
  - hermes-cli
mcp_servers:
  mealie:
    url: http://mealie-mcp.default.svc.cluster.local:8765/mcp
    timeout: 180
    connect_timeout: 60
terminal:
  backend: local
  cwd: /opt/data/workspace/kube-kl
  timeout: 180
  persistent_shell: true
  env_passthrough:
    - HASS_TOKEN
    - HASS_URL
memory:
  provider: honcho
  memory_enabled: true
  user_profile_enabled: true
  auto_migrate: true
  auto_summarize:
    threshold: 50
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
streaming:
  enabled: false
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true
platform_toolsets:
  cli:
    - hermes-cli
    - homeassistant
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - cronjob
    - delegation
    - file
    - homeassistant
    - image_gen
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
platforms:
  slack:
    enabled: true
  whatsapp:
    enabled: true
  telegram:
    enabled: true
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  tool_use_enforcement: auto
group_sessions_per_user: true
_config_version: 46
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
kanban:
  auto_decompose: true
auxiliary:
  profile_describer:
    provider: openai-codex
    model: gpt-5.6-luna
  kanban_decomposer:
    provider: openai-codex
    model: gpt-5.6-luna
  triage_specifier:
    provider: openai-codex
    model: gpt-5.6-luna
  vision:
    provider: openai-codex
    model: gpt-5.6-luna
  compression:
    provider: openai-codex
    model: gpt-5.6-luna
  skills_hub:
    provider: openai-codex
    model: gpt-5.6-luna
  approval:
    provider: openai-codex
    model: gpt-5.6-luna
  review:
    provider: openai-codex
    model: gpt-5.6-luna
  mcp:
    provider: openai-codex
    model: gpt-5.6-luna
  title_generation:
    provider: openai-codex
    model: gpt-5.6-luna
  curator:
    provider: openai-codex
    model: gpt-5.6-luna
command_allowlist:
  - script execution via -e/-c flag
  - ssh_config_write
fallback_providers:
  - provider: anthropic
    model: claude-opus-5
display:
  pet:
    enabled: false
    slug: homelander
plugins:
  enabled:
    - hermes-tailscale
    - job-search
    - quota
    - honcho
  disabled: []
approvals:
  mode: "off"
