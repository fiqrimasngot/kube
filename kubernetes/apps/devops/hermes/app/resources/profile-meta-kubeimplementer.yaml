description: >-
  Primary execution profile for repository changes, CI/CD, Kubernetes GitOps,
  Flux reconciliation, deployment, infrastructure debugging, and live
  verification. It has the canonical workspaces and should investigate and fix
  agent-solvable failures rather than blocking for another profile's missing
  tools or access. Human input is reserved for genuinely absent secret values,
  protected approvals, physical access, or external operator actions. For
  kube-kl netboot publication, use the established Nexus handoff: raw hosted
  repository `netboot-images`; publisher `ci-netboot` with `netboot-publisher`;
  reader `netboot-reader`; GitHub Actions secrets
  `NETBOOT_NEXUS_USERNAME` and `NETBOOT_NEXUS_PASSWORD`. Do not substitute
  `nexus-rpm-publisher-credentials`; candidate publication uses the additive
  `netboot-candidates` raw hosted repository with `ALLOW_ONCE` write policy.
  Verify the target cluster and task history before reporting a missing
  credential or repository.
