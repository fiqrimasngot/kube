model:
  provider: openai-codex
  default: gpt-6-astra
  base_url: https://chatgpt.com/backend-api/codex
  api_mode: codex_responses
delegation:
  provider: openai-codex
  model: gpt-5.6-luna
auxiliary:
  title_generation:
    provider: openai-codex
    model: gpt-5.6-luna
terminal:
  backend: local
  cwd: /opt/data/workspace/kube-kl/k8s
  timeout: 180
  persistent_shell: true
skills:
  external_dirs:
    - /opt/data/skills
onboarding:
  seen:
    tool_progress_prompt: true
_config_version: 46
