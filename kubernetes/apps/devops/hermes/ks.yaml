---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
  namespace: devops
spec:
  targetNamespace: devops
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  path: ./kubernetes/apps/devops/hermes/app
  prune: true
  decryption:
    provider: sops
  postBuild:
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
