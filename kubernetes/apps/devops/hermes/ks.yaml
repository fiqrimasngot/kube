---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: devops
spec:
  targetNamespace: devops
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  path: ./kubernetes/apps/devops/hermes/app
  prune: true
  postBuild:
    substituteFrom:
    - name: cluster-secrets
      kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 50Gi
      VOLSYNC_CACHE_CAPACITY: 20Gi
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  components:
    - ../../../../components/volsync
  interval: 30m
  retryInterval: 1m
  timeout: 10m
