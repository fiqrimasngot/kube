user git;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
  access_log /dev/stdout;
  include /etc/nginx/mime.types;
  sendfile on;
  server {
    listen 8080;
    server_name _;
    location ~ ^/(.+\.git)/info/refs$ {
      include fastcgi_params;
      fastcgi_param GIT_PROJECT_ROOT /srv/git;
      fastcgi_param GIT_HTTP_EXPORT_ALL 1;
      fastcgi_param PATH_INFO /$1/info/refs;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
      fastcgi_pass unix:/run/fcgiwrap.socket;
    }
    location ~ ^/(.+\.git)/git-upload-pack$ {
      include fastcgi_params;
      fastcgi_param GIT_PROJECT_ROOT /srv/git;
      fastcgi_param GIT_HTTP_EXPORT_ALL 1;
      fastcgi_param PATH_INFO /$1/$2;
      fastcgi_param SCRIPT_FILENAME /usr/lib/git-core/git-http-backend;
      fastcgi_pass unix:/run/fcgiwrap.socket;
    }
    location = /cgit.css { alias /usr/share/cgit/cgit.css; }
    location = /cgit.png { alias /usr/share/cgit/cgit.png; }
    location / {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /usr/lib/cgit/cgit.cgi;
      fastcgi_param PATH_INFO $uri;
      fastcgi_param QUERY_STRING $query_string;
      fastcgi_param HTTP_HOST $host;
      fastcgi_pass unix:/run/fcgiwrap.socket;
    }
  }
}
