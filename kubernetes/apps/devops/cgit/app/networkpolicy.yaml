---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cgit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cgit
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
    - ports:
        - port: ssh
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
