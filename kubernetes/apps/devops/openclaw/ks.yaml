---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app clawdbot
spec:
  targetNamespace: devops
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/devops/clawdbot/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  components:
    - ../../../../components/volsync
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: clawdbot
      VOLSYNC_CAPACITY: 5Gi
      # VOLSYNC_STORAGECLASS: longhorn
  interval: 30m
  retryInterval: 1m
  timeout: 5m
