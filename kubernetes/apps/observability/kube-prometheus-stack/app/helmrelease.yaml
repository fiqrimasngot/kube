---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta1.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 80.14.4
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:

    kubeApiServer:
      serviceMonitor:
        selector:
          k8s-app: kube-apiserver

    kubeScheduler:
      service:
        selector:
          k8s-app: kube-scheduler
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv4

    kubeControllerManager: &kubeControllerManager
      service:
        selector:
          k8s-app: kube-controller-manager
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv4

    kubeEtcd:
      <<: *kubeControllerManager # etcd runs on control plane nodes
      service:
        selector:
          k8s-app: kube-etcd
        ipFamilyPolicy: SingleStack
        ipFamilies:
          - IPv4
        port: 2381
        targetPort: 2381
      endpoints:
        - 10.32.1.51
      serviceMonitor:
        scheme: http
    kubeProxy:
      enabled: false
    nodeExporter:
      serviceMonitor:
        relabelings:
          - action: replace
            regex: (.*)
            replacement: $1
            sourceLabels:
              - __meta_kubernetes_pod_node_name
            targetLabel: kubernetes_node
    kubeStateMetrics:
      enabled: true
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    kube-state-metrics:
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
              - kustomize.toolkit.fluxcd.io
              - helm.toolkit.fluxcd.io
              - notification.toolkit.fluxcd.io
              - image.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - buckets
              - helmrepositories
              - helmcharts
              - ocirepositories
              - kustomizations
              - helmreleases
              - alerts
              - providers
              - receivers
              - imagerepositories
              - imagepolicies
              - imageupdateautomations
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Kustomization resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
                      source_name: [spec, sourceRef, name]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRelease resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
                      chart_name: [status, history, "0", chartName]
                      chart_app_version: [status, history, "0", appVersion]
                      chart_ref_name: [spec, chartRef, name]
                      bucket_name: [spec, bucketName]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmChart
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux HelmChart resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      chart_name: [spec, chart]
                      chart_version: [spec, version]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1beta2
                  kind: OCIRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux OCIRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
                      url: [spec, url]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Alert
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Alert resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1beta3
                  kind: Provider
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Provider resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: notification.toolkit.fluxcd.io
                  version: v1
                  kind: Receiver
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux Receiver resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      webhook_path: [status, webhookPath]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageRepository
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageRepository resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      image: [spec, image]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImagePolicy
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImagePolicy resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, imageRepositoryRef, name]
              - groupVersionKind:
                  group: image.toolkit.fluxcd.io
                  version: v1beta2
                  kind: ImageUpdateAutomation
                metricNamePrefix: gotk
                metrics:
                  - name: "resource_info"
                    help: "The current state of a Flux ImageUpdateAutomation resource."
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      source_name: [spec, sourceRef, name]
    prometheus-node-exporter:
      # fullnameOverride: node-exporter
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    grafana:
      assertNoLeakedSecrets: false
      envFromSecret: grafana-admin-secret
      env:
        GF_EXPLORE_ENABLED: true
        GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
        GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: natel-discrete-panel,pr0ps-trackmap-panel,panodata-map-panel
        GF_SECURITY_ANGULAR_SUPPORT_ENABLED: true
        GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
      defaultDashboardsTimezone: browser
      deploymentStrategy:
        type: Recreate
      plugins:
        - grafana-piechart-panel
        - grafana-clock-panel
        - grafana-piechart-panel
        - grafana-worldmap-panel
        - natel-discrete-panel
        - pr0ps-trackmap-panel
        - vonage-status-panel
      serviceMonitor:
        enabled: true
      route:
        main:
          enabled: true
          parentRefs:
            - namespace: network
              name: envoy-external
          hostnames:
            - grafana.${SECRET_DOMAIN}
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Grafana
          gethomepage.dev/icon: sh-grafana
          gethomepage.dev/description: "Monitoring"
      grafana.ini:
        auth.generic_oauth:
          name: Authentik
          enabled: true
          client_id: $__env{openid-config-client-id}
          client_secret: $__env{openid-config-client-secret}
          scopes: "openid email profile"
          auth_url: "https://auth.${SECRET_DOMAIN}/application/o/authorize/"
          token_url: "https://auth.${SECRET_DOMAIN}/application/o/token/"
          api_url: "https://auth.${SECRET_DOMAIN}/application/o/userinfo/"
          role_attribute_path: |
            contains(groups[*], 'Grafana Admins') && 'Admin' || 'Viewer'
        auth:
          signout_redirect_url: "https://auth.${SECRET_DOMAIN}/application/o/grafana/end-session/"
          oauth_auto_login: true
        users:
          viewers_can_edit: true
        auth.anonymous:
          enabled: false
          org_role: Viewer
        auth.basic:
          enabled: false
        feature_toggles:
          autoMigrateOldPanels: true
      sidecar:
        logLevel: WARN
        dashboards:
          enabled: true
          searchNamespace: ALL
          label: grafana-dashboard
          labelValue: 'true'
          provider:
            foldersFromFilesStructure: true
      datasources:
        datasource.yaml:
          apiVersion: 1
          deleteDatasources:
            - name: Loki
              orgId: 1
            - name: Alertmanager
              orgId: 1
            - name: Prometheus
              orgId: 1
          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://kube-prometheus-stack-prometheus.observability:9090
              isDefault: true
              uid: Prometheus
            - name: Loki
              editable: false
              orgId: 1
              type: loki
              url: http://loki-gateway.observability.svc.cluster.local:80
              version: 1
              jsonData:
                timeout: 60
                maxLines: 200
            - name: Alertmanager
              type: alertmanager
              access: proxy
              url: http://kube-prometheus-stack-alertmanager.observability:9093
              jsonData:
                implementation: prometheus
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: "default"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/default
            - name: network
              orgId: 1
              folder: network
              type: file
              disableDeletion: true
              editable: false
              allowUiUpdates: false
              options:
                path: /var/lib/grafana/dashboards/network
            - name: "kubernetes"
              orgId: 1
              folder: ""
              type: file
              disableDeletion: false
              editable: true
              options:
                path: /var/lib/grafana/dashboards/kubernetes
            - type: file
              name: Cluster
              folder: Cluster
              editable: true
              allowUiUpdates: true
              disableDeletion: false
              options:
                path: /tmp/dashboards/Cluster
                foldersFromFilesStructure: true
      dashboards:
        default:
          blackbox:
            gnetId: 13659
            revision: 1
            datasource: Prometheus
          node-exporter-full:
            gnetId: 1860
            revision: 29
            datasource: Prometheus
          ceph-pools:
            gnetId: 2842
            revision: 18
            datasource: Prometheus
          # Ref: https://grafana.com/grafana/dashboards/5342-ceph-pools/
          smartctl-exporter:
            # renovate: depName="SMARTctl Exporter Dashboard"
            gnetId: 22604
            revision: 2
            datasource:
              - { name: DS_PROMETHEUS, value: Prometheus }
        kubernetes:
          kubernetes-api-server:
            # renovate: depName="Kubernetes / System / API Server"
            gnetId: 15761
            revision: 14
            datasource: Prometheus
          kubernetes-coredns:
            # renovate: depName="Kubernetes / System / CoreDNS"
            gnetId: 15762
            revision: 13
            datasource: Prometheus
          kubernetes-global:
            # renovate: depName="Kubernetes / Views / Global"
            gnetId: 15757
            revision: 31
            datasource: Prometheus
          cloudnative-pg:
            url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/main/charts/cluster/grafana-dashboard.json
            datasource: Prometheus
          kubernetes-namespaces:
            # renovate: depName="Kubernetes / Views / Namespaces"
            gnetId: 15758
            revision: 27
            datasource: Prometheus
          kubernetes-nodes:
            # renovate: depName="Kubernetes / Views / Nodes"
            gnetId: 15759
            revision: 19
            datasource: Prometheus
          kubernetes-pods:
            # renovate: depName="Kubernetes / Views / Pods"
            gnetId: 15760
            revision: 22
            datasource: Prometheus
          node-exporter-full:
            # renovate: depName="Node Exporter Full"
            gnetId: 1860
            revision: 37
            datasource: Prometheus
          volsync:
            # renovate: depName="VolSync Dashboard"
            gnetId: 21356
            revision: 3
            datasource:
              - { name: DS_PROMETHEUS, value: Prometheus }
              - { name: VAR_REPLICATIONDESTNAME, value: .*-dst }
          nvidia-dcgm-exporter:
            url: https://raw.githubusercontent.com/NVIDIA/dcgm-exporter/refs/heads/main/grafana/dcgm-exporter-dashboard.json
            datasource: Prometheus
          dragonfly:
            url: https://raw.githubusercontent.com/dragonflydb/dragonfly/refs/heads/main/tools/local/monitoring/grafana/provisioning/dashboards/dragonfly.json
            datasource: Prometheus
        network:
          speedtest:
            datasource: Prometheus
            gnetId: 13665
            revision: 1
          pihole:
            # renovate: depName="Omada Exporter: Client Insights - Prometheus"
            gnetId: 10176
            revision: 3
            datasource: Prometheus
          cert-manager:
            url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager.json
            datasource: Prometheus
          cloudflared:
            # renovate: depName="Cloudflare Tunnels (cloudflared)"
            gnetId: 17457
            revision: 6
            datasource:
              - { name: DS_PROMETHEUS, value: Prometheus }
          external-dns:
            # renovate: depName="External-dns"
            gnetId: 15038
            revision: 3
            datasource: Prometheus
          flux-cluster:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
            datasource: Prometheus
          flux-control-plane:
            url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
            datasource: Prometheus
          miniflux:
            url: https://raw.githubusercontent.com/miniflux/v2/main/contrib/grafana/dashboard.json
            datasource: Prometheus
          nginx:
            url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/nginx.json
            datasource: Prometheus
          nginx-request-handling-performance:
            url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/master/deploy/grafana/dashboards/request-handling-performance.json
            datasource: Prometheus
    prometheusOperator:
      configReloaderCpu: 0
    prometheus:
      route:
        main:
          enabled: true
          parentRefs:
            - namespace: network
              name: envoy-internal
          hostnames:
            - prometheus.${SECRET_DOMAIN}

      prometheusSpec:
        # additionalScrapeConfigs:
        #   - job_name: node-exporter
        #     static_configs:
        #       - targets:
        #           - 10.32.1.1:9100
        #           - 10.32.1.52:9100
        #           - 10.32.1.23:9100
          # - job_name: node-exporter-openwrt
          #   static_configs:
          #     - targets:
          #         - 192.168.100.1:9101
        retention: 15d
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            cpu: 750m
            memory: 2Gi
        podMonitorSelector: &selector
          matchLabels: null
        probeSelector: *selector
        ruleSelector: *selector
        scrapeConfigSelector: *selector
        serviceMonitorSelector: *selector
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        enableAdminAPI: true
        walCompression: true
        enableFeatures:
          - auto-gomemlimit
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
    alertmanager:
      config:
        global:
          slack_api_url: "${SECRET_ALERT_MANAGER_SLACK_WEBHOOK}"
          resolve_timeout: 5m
        receivers:
          - name: "Discord"
            discord_configs:
              - webhook_url: "${SECRET_ALERT_MANAGER_DISCORD_WEBHOOK}"
                title: |-
                  [{{ .Status | toUpper }}:{{ if eq .Status "firing" }}{{ .Alerts.Firing | len }}{{ else }}{{ .Alerts.Resolved | len }}{{ end }}]
                message: |-
                  {{- range .Alerts }}
                    **{{ .Labels.alertname }} {{ if ne .Labels.severity "" }}({{ .Labels.severity | title }}){{ end }} **
                    {{ if ne .Labels.namespace "" }}**Namespace: ** {{ .Labels.namespace | title }} {{ end }}
                    {{- if ne .Annotations.description "" }}
                      **Description:** {{ .Annotations.description }}
                    {{- else if ne .Annotations.message "" }}
                      **Message:** {{ .Annotations.message }}
                    {{- else if ne .Annotations.summary "" }}
                      **Summary:** {{ .Annotations.summary }}
                    {{- else }}
                      **Description:** N/A
                    {{- end }}
                    {{ if ne .Annotations.runbook_url "" }}**Runbook: ** {{ .Annotations.runbook_url }} {{ end }}
                  {{- end }}
          - name: "Slack"
            slack_configs:
            - channel: 'C0A9WPR4NTH'
              api_url: "${SECRET_ALERT_MANAGER_SLACK_WEBHOOK}"
              username: 'Prometheus'
              send_resolved: true
              # https://github.com/onedr0p/home-cluster/blob/main/cluster/apps/monitoring/kube-prometheus-stack/helm-release.yaml#L33
              title: |-
                [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if ne .CommonAnnotations.summary ""}}{{ .CommonAnnotations.summary }} {{ else if ne .CommonAnnotations.message ""}}{{ .CommonAnnotations.message }} {{ else if ne .CommonAnnotations.description ""}}{{ .CommonAnnotations.description }} {{ else }}{{ .CommonLabels.alertname }}{{ end }}
              text: >-
                {{ range .Alerts -}}
                  **Alert:** {{ .Annotations.title }}{{ if .Labels.severity }} `{{ .Labels.severity }}`{{ end }}
                {{ if ne .Annotations.summary ""}}**Summary:** {{ .Annotations.summary }} {{ else if ne .Annotations.message ""}}**Message:** {{ .Annotations.message }} {{ else if ne .Annotations.description ""}}**Description:** {{ .Annotations.description }}{{ end }}
                  **Details:**
                  {{ range .Labels.SortedPairs }} • {{ .Name }}: `{{ .Value }}`
                  {{ end }}
                {{ end }}
          - name: "dummy"
        route:
          group_by: ["..."]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 1d
          routes:
          - receiver: 'dummy'
            matchers:
            - severity =~ "none"
          # Send to Discord
          - receiver: "Slack"
            continue: true   # 🔑 fan-out
          - receiver: "Discord"
      route:
        main:
          enabled: true
          parentRefs:
            - namespace: network
              name: envoy-internal
          hostnames:
            - alert-manager.${SECRET_DOMAIN}
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: Alertmanager
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Alertmanager
          gethomepage.dev/icon: sh-telegraf
      alertmanagerSpec:
        logLevel: debug
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi
    additionalPrometheusRulesMap:
      node-rules:
        groups:
          - name: node
            rules:
              - alert: KubernetesNodeDiskUsagePercentage
                expr: (100 - 100 * sum(node_filesystem_avail_bytes{device!~"tmpfs|by-uuid",fstype=~"xfs|ext4"} / node_filesystem_size_bytes{device!~"tmpfs|by-uuid",fstype=~"xfs|ext4"}) BY (instance,device)) > 85
                for: 5m
                labels:
                  context: node
                  severity: warning
                annotations:
                  description: Node disk usage above 85%
                  summary: Disk usage on target {{ $labels.instance }} at 85%
              - alert: ExpandedNodeDiskIOSaturation
                expr: rate(node_disk_io_time_weighted_seconds_total{job="node-exporter", device=~"(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dm-.+|md.+|dasd.+)"}[5m]) > 10
                for: 120m
                labels:
                  context: node
                  severity: warning
                annotations:
                  description: |
                    Disk IO queue (aqu-sq) is high on {{ $labels.device }} at {{ $labels.instance }}, has been above 10 for the last 30 minutes, is currently at {{ printf "%.2f" $value }}.
                    This symptom might indicate disk saturation.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodediskiosaturation
                  summary: Disk IO queue is high.
              - alert: ExpandedNodeSystemSaturation
                expr: |-
                  node_load1{job="node-exporter"} / count without (cpu, mode) (node_cpu_seconds_total{job="node-exporter", mode="idle"}) > 2
                for: 60m
                labels:
                  context: node
                  severity: warning
                annotations:
                  description: |
                    System load per core at {{ $labels.instance }} has been above 2 for the last 15 minutes, is currently at {{ printf "%.2f" $value }}.
                    This might indicate this instance resources saturation and can cause it becoming unresponsive.
                  runbook_url: https://runbooks.prometheus-operator.dev/runbooks/node/nodesystemsaturation
                  summary: System saturated, load per core is very high.
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
      pod-rules:
        groups:
          - name: pod
            rules:
              - alert: KubernetesPodCrashLooping
                expr: increase(kube_pod_container_status_restarts_total[1m]) > 3
                for: 2m
                annotations:
                  summary: Kubernetes pod crash looping (instance {{ $labels.instance }})
                  description: "Pod {{ $labels.pod }} is crash looping\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      pvc-rules:
        groups:
          - name: pvc
            rules:
              - alert: KubernetesVolumeAlmostOutOfDiskSpace
                expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: Kubernetes Volume almost out of disk space (instance {{ $labels.instance }})
                  description: "Volume is almost full (< 10% left)\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
      zfs-rules:
        groups:
          - name: zfs
            rules:
              - alert: ZfsUnexpectedPoolState
                annotations:
                  summary: ZFS pool {{$labels.zpool}} on {{$labels.instance}} is in a unexpected state {{$labels.state}}
                expr: node_zfs_zpool_state{state!="online"} > 0
                labels:
                  severity: critical
