---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: fairwinds-charts
spec:
  interval: 15m
  url: https://charts.fairwinds.com/stable
  timeout: 3m
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app goldilocks
spec:
  interval: 30m
  chart:
    spec:
      chart: goldilocks
      version: 10.2.0
      sourceRef:
        kind: HelmRepository
        name: fairwinds-charts
  values:
    vpa:
      enabled: true
    dashboard:
      replicaCount: 1
      ingress:
        enabled: true
        ingressClassName: "internal"
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: "{{ title .Release.Name }}"
          gethomepage.dev/icon: "{{ .Release.Name }}"
          gethomepage.dev/description: "Steam on web"
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values \"service\" .Release.Name \"ports\" \"http\" \"port\" }}"
        hosts:
          - host: &host "goldilocks.${SECRET_DOMAIN}"
            paths:
              - path: /
                type: Prefix

    resources:
      limits:
        memory: 32Mi
      requests:
        cpu: 25m

    controller:
      resources:
        requests:
          cpu: 15m
          memory: 32Mi
        limits:
          memory: 128Mi
