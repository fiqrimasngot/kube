---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tdarr-node-cpu
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      tdarr-node-cpu:
        annotations:
          reloader.stakater.com/auto: "true"
        # Replicas managed by HPA - don't set here
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/haveagitgat/tdarr_node
              tag: 2.58.02@sha256:62e14509bc19dea9b6f5dc85d0942163b6fa240d780a53eb590d894d46c9e1f2
            envFrom:
              - configMapRef:
                  name: tdarr-config
                  optional: true
            env:
              TZ: ${TIMEZONE}
              PGID: 0
              PUID: 0
              # Tdarr Server connection
              serverIP: tdarr.media
              serverPort: "8266"
              # Node identification
              nodeName: "CPU-$(POD_NAME)"
              nodeID: "CPU-$(POD_NAME)"
              # Node configuration
              inContainer: "true"
              ffmpegVersion: "7"
              # CPU-only processing
              nodeHardwareType: cpu
              # Performance settings
              nodeIP: "0.0.0.0"
              nodePort: "8267"

              # Worker configuration for CPU-only nodes
              transcodegpuWorkers: "0"  # No GPU workers on CPU nodes
              transcodecpuWorkers: "2"  # Use 2 CPU workers for transcoding
              healthcheckgpuWorkers: "0"  # No GPU health checks
              healthcheckcpuWorkers: "1"  # Use 1 CPU worker for health checks
              pollInterval: "2000"  # Poll every 2 seconds
              startPaused: "false"  # Start processing immediately
              maxLogSizeMB: "10"  # Log size limit
              logLevel: "INFO"
              priority: "-1"

              POD_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.name
    defaultPodOptions:
      priorityClassName: tdarr-priority  # Use lower priority for batch processing
      # nodeSelector:
      #   kubernetes.io/hostname: "k3s-2"
    service:
      app:
        controller: tdarr-node-cpu
        ports:
          server:
            enabled: true
            protocol: TCP
            port: 8266

    persistence:
      movies:
        type: nfs
        server: ${SECRET_NFS_SVC}
        path: /movies
        # globalMounts:
        #   - path: /media/movies
      tv:
        type: nfs
        server: ${SECRET_NFS_SVC}
        path: /tv
        # globalMounts:
        #   - path: /media/tv
      music:
        type: nfs
        server: ${SECRET_NFS_SVC}
        path: /music
        # globalMounts:
        #   - path: /media/music
      transcode:
        type: nfs
        server: ${SECRET_NFS_SVC}
        path: /temp
        globalMounts:
          - path: /temp
