---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ghost
spec:
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  targetNamespace: media
  path: ./kubernetes/apps/media/ghost/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  components:
    - ../../../../components/volsync
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 2Gi
      # VOLSYNC_STORAGECLASS: longhorn
  interval: 30m
  retryInterval: 1m
  timeout: 5m
