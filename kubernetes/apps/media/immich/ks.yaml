---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app immich
spec:
  targetNamespace: media
  path: ./kubernetes/apps/media/immich/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    # substitute:
    #   APP: *app
    #   APP_UID: "0"
    #   APP_GID: "0"
      # VOLSYNC_CAPACITY: 1Ti
  interval: 30m
  retryInterval: 1m
  timeout: 5m
