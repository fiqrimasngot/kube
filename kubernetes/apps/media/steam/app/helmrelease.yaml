---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app steam
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      app:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          steam:
            image:
              repository: josh5/steam-headless
              tag: latest@sha256:59b509525951fc941979094493af63c1c8a73b23c069b30038108a833800d83b
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: *app
            env:
              NAME: SteamHeadless
              TZ: ${TIMEZONE}
              HOME_DIR: &homeDir /home/default
              GAMES_DIR: &gameDir /mnt/games
              NVIDIA_VISIBLE_DEVICES: all
              NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
              NVIDIA_DISABLE_DRIVER_INSTALL: "true"
              DISABLE_NVIDIA_DRIVER_INSTALL: "true"

              MODE: primary
              WEB_UI_MODE: vnc
              ENABLE_VNC_AUDIO: false
              PORT_NOVNC_WEB: &port 8083
              ENABLE_EVDEV_INPUTS: "true"

              ENABLE_STEAM: "true"
              STEAM_ARGS: -silent
              ENABLE_SUNSHINE: "true"
            # probes:
            #   liveness: &probe
            #     enabled: true
            #   readiness: *probe
            #   startup: *probe
            securityContext:
              privileged: true
              seccompProfile:
                type: Unconfined
              capabilities:
                add:
                  - SYS_PTRACE
                  - NET_ADMIN
                  - SYS_ADMIN
                  - SYS_NICE
            resources:
            #   requests:
            #     memory: 24G
            #     cpu: 6
              limits:
            #     memory: 24G
            #     cpu: 6
                nvidia.com/gpu: 1
    defaultPodOptions:
      runtimeClassName: nvidia
      hostNetwork: true
      securityContext:
        fsGroup: 1000
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    service:
      app:
        controller: app
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: ${SECRET_SUNSHINE_SVC}
        ports:
          http:
            port: *port
          s-t1:
            port: 47984
            protocol: TCP
          s-t2:
            port: 47989
            protocol: TCP
          sunshine-ui:
            port: 47990
          s-t3:
            port: 48010
            protocol: TCP
          s-u1:
            port: 47998
            protocol: UDP
          s-u2:
            port: 47999
            protocol: UDP
          s-u3:
            port: 48000
            protocol: UDP
    route:
      app:
        hostnames: ["steam.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      home:
        existingClaim: *app
        globalMounts:
          - path: *homeDir
      games:
        type: nfs
        server: ${SECRET_NFS_SVC}
        path: /media/games
        globalMounts:
          - path: *gameDir
      dev-shm:
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /dev/shm

      dev-input:
        type: hostPath
        hostPath: /dev/input
        globalMounts:
          - path: /dev/input

      # dev-uinput:
      #   type: hostPath
      #   hostPath: /dev/uinput
      #   hostPathType: CharDevice
      #   globalMounts:
      #     - path: /dev/uinput
      #
      # dev-fd:
      #   type: hostPath
      #   hostPath: /proc/self/fd
      #   globalMounts:
      #     - path: /dev/fd
