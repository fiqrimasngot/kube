
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app i2pd
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      i2pd:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: registry.skysolutions.fi/docker.io/purplei2p/i2pd
              tag: release-2.50.0
            env:
              TZ: "${TIMEZONE}"
            probes:
              startup:
                enabled: false
              liveness:
                enabled: false
              readiness:
                enabled: false
            resources:
              requests:
                memory: 128Mi
              limits:
                memory: 1Gi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [10000]
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: i2pd
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          # io.cilium/lb-ipam-ips: ${SECRET_I2P_SVC}
        ports:
          http:
            port: &port 7070
          httpproxy:
            port: 4444
          socksproxy:
            port: 4447



    route:
      app:
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/description: VPN
          gethomepage.dev/group: "{{ title .Release.Namespace }}"
          gethomepage.dev/name: "{{ title .Release.Name }}"
          gethomepage.dev/icon: "{{ .Release.Name }}"
          gethomepage.dev/siteMonitor: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local:{{ index .Values \"service\" .Release.Name \"ports\" \"http\" \"port\" }}"

    persistence:
      home:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /home/i2pd/data
      configfile:
        enabled: true
        type: configMap
        name: i2pd
        globalMounts:
          - path: /home/i2pd/data/i2pd.conf
            subPath: i2pd.conf
            readOnly: true

