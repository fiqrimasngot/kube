---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.5.3
      sourceRef:
        kind: HelmRepository
        name: authentik
      interval: 10m
  values:
    global:
      addPrometheusAnnotations: true
      podAnnotations:
        reloader.stakater.com/auto: "true"
      deploymentStrategy:
        type: RollingUpdate
    backup:
      accessKey:
        name: cloudnative-pg
        key: aws-access-key-id
      secretKey:
        name: cloudnative-pg
        key: aws-secret-access-key
      bucket: authentik-db
      # region: eu-central-1
      host: http://minio.storage.svc.cluster.local:9000
    authentik:
      email:
        host: "smtp-relay.network.svc.cluster.local"
        port: 25
        use_ssl: false
        from: "Authentik <auth@${SECRET_DOMAIN}>"
      secret_key: ${SECRET_AUTHENTIK_SECRET_KEY}
      postgresql:
        name: authentik
        user: authentik
        password: ${SECRET_AUTHENTIK_DB_PASSWORD}
      redis:
        host: dragonfly.database.svc.cluster.local
        db: 1
        port: 6379
    server:
      route:
        main:
          enabled: true
          hostnames:
            - auth.${SECRET_DOMAIN}
          # annotations:
          # external-dns.alpha.kubernetes.io/target: sso.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-external
              namespace: network
              sectionName: https
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/name: Authentik
          gethomepage.dev/icon: sh-authentik
          gethomepage.dev/description: "SSO Admin"
          gethomepage.dev/widget.url: "http://authentik-server.security.svc.cluster.local:80"
          gethomepage.dev/widget.type: authentik
          gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik
          # gethomepage.dev/widget.key: "${AUTHENTIK_API}"
          gethomepage.dev/widget.version: "2"
      podSecurityContext:
        fsGroup: 150
      securityContext:
        runAsUser: 1000
        runAsGroup: 150
      volumeMounts:
        - mountPath: /media
          name: authentik-media
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.4@sha256:ebd9d30add17acdf935d73eb004758c7dfd9388aaa605fda70ad74378ab92aec
          # envFrom:
          #   - secretRef:
          #       name: *secret-postgres
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      ingress:
        enabled: true
        ingressClassName: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - &host sso.${SECRET_DOMAIN}
        tls:
          - secretName: ${SECRET_DOMAIN/./-}-tls
            hosts:
              - *host

    worker:
      replicas: 1
      # Increase probe timeouts - worker takes ~90s to start
      livenessProbe:
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 5
      readinessProbe:
        initialDelaySeconds: 120
        periodSeconds: 30
        timeoutSeconds: 30
        failureThreshold: 5
      startupProbe:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 30
        failureThreshold: 30
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1Gi
    postgresql:
      enabled: false
    redis:
      enabled: false
    prometheus:
      rules:
        enabled: true #
