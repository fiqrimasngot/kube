---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app go2rtc
spec:
  targetNamespace: security
  dependsOn:
    - name: minio
      namespace: storage
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    # substitute:
    #   APP: *app
    #   VOLSYNC_CAPACITY: 2Gi
    #   APP_UID: "1001"
    #   APP_GID: "1001"
  path: ./kubernetes/apps/security/go2rtc/app
  # components:
  #   - ../../../../components/volsync
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
