machine:
  udev:
    # List of udev rules to apply to the udev system
    rules:
      - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
      - KERNEL=="event*", SUBSYSTEM=="input", ATTRS{name}=="Sunshine X-Box One*", ENV{ID_INPUT}="1", ENV{ID_INPUT_JOYSTICK}="1", ENV{ID_INPUT_GAMEPAD}="1"
  files:
    - op: create
      path: /etc/cri/conf.d/20-customization.part
      content: |
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          device_ownership_from_security_context = true
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
      # Enable V2 Image Engine for Longhorn
      - name: nvme_tcp
      - name: vfio_pci
      - name: uinput
  # disks:
  #     - device: /dev/sdb
  #       partitions:
  #         - mountpoint: /var/lib/longhorn
  #     - device: /dev/sdc
  #       partitions:
  #         - mountpoint: /var/lib/sdc
