---
name: Repository runner smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    if: github.repository == 'fiqrimasngot/kube' && github.ref == 'refs/heads/main'
    runs-on: gha-kube
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify repository-bound runner
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 --version
          docker version
          docker buildx version
          getent hosts github.com ghcr.io results-receiver.actions.githubusercontent.com
          curl --fail --silent --show-error --output /dev/null https://api.github.com
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://ghcr.io/v2/)
          test "$code" = 401
