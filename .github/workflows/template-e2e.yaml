---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "E2E"

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  validate-invalid:
    if: ${{ github.repository == 'fiqrimasngot/kube' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: reject-invalid (${{ matrix.fixture }})
    runs-on: gha-kube
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - overlapping-cidrs
          - nested-cidr-overlap
          - non-canonical-cidr
          - tiny-svc-cidr
          - duplicate-gateway-addrs
          - duplicate-node-names
          - reserved-node-name
          - bad-mac-address
          - bad-repo-url
          - missing-known-hosts
          - node-addr-outside-cidr
          - node-uses-gateway-addr
          - gateway-node-collision
          - bad-vlan-tag
          - bad-bgp-asn
          - missing-dns-token
          - tunnel-without-dns
          - missing-external-gateway
          - missing-schematic
          - partial-bgp
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libatomic1

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Assert schema rejects ${{ matrix.fixture }}.toml
        run: |
          fixture=./.github/template-tests/invalid/${{ matrix.fixture }}.toml
          if uv run --quiet --locked --no-dev ./template/scripts/validate.py "$fixture" >/dev/null 2>&1; then
            echo "::error::schema accepted invalid fixture ${{ matrix.fixture }} (expected rejection)"
            exit 1
          fi
          echo "schema correctly rejected ${{ matrix.fixture }}"
          # Also surface the actual error message in the log for debuggability.
          uv run --quiet --locked --no-dev ./template/scripts/validate.py "$fixture" || true

  validator-tests:
    if: ${{ github.repository == 'fiqrimasngot/kube' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: validator-tests
    runs-on: gha-kube
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libatomic1

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Run validator tests
        run: |
          python3 ./.github/template-tests/test_retry_network.py
          uv run --quiet --locked pytest ./template/scripts/test_validate.py

  validate-valid:
    if: ${{ github.repository == 'fiqrimasngot/kube' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: accept-valid (${{ matrix.fixture }})
    runs-on: gha-kube
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - public
          - private
          - selfhosted
          - no-webhook
          - internal
          - direct
          - single-node
          - multi-controller
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libatomic1

      - name: Setup mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          experimental: true
          install_args: --locked

      - name: Run init recipe
        run: just init

      - name: Remove checked-in rendered files
        run: yes | just template reset

      - name: Prepare files
        run: |
          cp ./.github/template-tests/valid/${{ matrix.fixture }}.toml cluster.toml
          echo '{"AccountTag":"fake","TunnelSecret":"fake","TunnelID":"fake"}' > cloudflare-tunnel.json
          touch kubeconfig

      - name: Assert cluster.toml passes the JSON Schema
        run: taplo check --schema "file://$PWD/cluster.schema.json" ./cluster.toml

      - name: Run configure recipe
        run: bash ./.github/template-tests/retry-network.sh just configure

      - name: Format and verify rendered output
        run: |
          oxfmt ./.sops.yaml ./bootstrap ./kubernetes ./talos
          oxfmt --check ./.sops.yaml ./bootstrap ./kubernetes ./talos

      - name: Install flate
        uses: home-operations/flate/action@bbb6ebc344da051752dbdb1b413860ceffcfb63d # v0.7.3
        with:
          base: ""

      - name: Run flate test
        run: bash ./.github/template-tests/retry-network.sh flate test all -p ./kubernetes/flux/cluster

      - name: Render bootstrap helmfile charts
        run: bash ./.github/template-tests/retry-network.sh just template test-helmfile

      - name: Dry run bootstrap talos recipe
        run: just --dry-run bootstrap talos

      - name: Create talos secret
        run: just bootstrap talos-secret

      - name: Render talos configs
        run: just talos render

      - name: Validate talos configs
        run: |
          for config in ./talos/rendered/*.yaml; do
            talosctl validate --config "$config" --mode metal
          done

      - name: Dry run bootstrap apps recipe
        run: just --dry-run bootstrap apps

      - name: Run reset recipe
        run: yes | just template reset

      - name: Run tidy recipe
        run: yes | just template tidy
