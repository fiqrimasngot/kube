[makejinja]
inputs = ["./template/overrides","./template/config"]
output = "./"
# Study Planner Release owns this live manifest; generation must not reset it.
exclude_patterns = [
  "*.partial.yaml.j2",
  "kubernetes/apps/default/study-planner/app/helmrelease.yaml*",
]
import_paths = ["./template/scripts"]
loaders = ["plugin:Plugin"]
jinja_suffix = ".j2"
copy_metadata = true
force = true
undefined = "strict"

[makejinja.delimiter]
block_start = "#%"
block_end = "%#"
comment_start = "#|"
comment_end = "#|"
variable_start = "#{"
variable_end = "}#"
